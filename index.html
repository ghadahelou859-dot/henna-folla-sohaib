<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#6f0916">
  <meta name="description" content="دعوة حنّة فلة وصهيب">

  <title>حنّة فلة وصهيب</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="invitation" aria-label="دعوة حنّة فلة وصهيب">

    <!-- الكفر -->
    <section
      class="page image-page cover-page"
      id="cover"
      aria-label="غلاف الدعوة"
    >
      <img
        src="cover-v3.jpeg"
        alt="صهيب وفلة"
      >

      <button
        id="openInvite"
        class="open-button"
        type="button"
        aria-label="افتح الدعوة"
      >
        افتح الدعوة
      </button>
    </section>

    <!-- فيديو المقدمة -->
    <section
      class="page video-page opening-page locked"
      id="opening"
      aria-label="فيديو افتتاح الدعوة"
    >
      <video
        id="openingVideo"
        playsinline
        muted
        preload="auto"
        poster="opening-poster.jpg"
      >
        <source
          src="opening.mp4"
          type="video/mp4"
        >
      </video>
    </section>

    <!-- فيديو المعلومات -->
    <section
      class="page video-page locked"
      id="details"
      aria-label="معلومات الحنّة"
    >
      <video
        id="detailsVideo"
        playsinline
        muted
        loop
        preload="auto"
      >
        <source
          src="details.mp4"
          type="video/mp4"
        >
      </video>

      <div class="swipe-hint" aria-hidden="true">
        اسحبي للأعلى في أي وقت
      </div>
    </section>

    <!-- العد التنازلي ومشاركة الصورة -->
    <section
      class="page image-page countdown-page locked"
      id="countdown"
      aria-label="العد التنازلي ومشاركة الصور"
    >
      <img
        src="countdown-share-v3.png"
        alt="العد التنازلي ومشاركة صورة الحنّة"
      >

      <div
        class="countdown-values"
        id="countdownValues"
        aria-live="polite"
        aria-label="الوقت المتبقي"
      >
        <span id="seconds">00</span>
        <span id="minutes">00</span>
        <span id="hours">00</span>
        <span id="days">00</span>
      </div>

      <!-- زر شفاف فوق زر مشاركة الصورة -->
      <a
        class="share-hotspot"
        href="https://wa.me/972593828727?text=%D8%B5%D9%88%D8%B1%D8%AA%D9%86%D8%A7%20%D8%A7%D9%84%D8%AD%D9%84%D9%88%D8%A9%20%D9%85%D9%86%20%D8%AD%D9%86%D9%91%D8%A9%20%D9%81%D9%84%D8%A9%20%D9%88%D8%B5%D9%87%D9%8A%D8%A8%20%F0%9F%A4%8D"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="شاركينا صورتك من الحنّة على واتساب"
      ></a>
    </section>

    <!-- صفحة التواصل الاجتماعي -->
    <section
      class="page image-page social-page locked"
      id="social"
      aria-label="صفحات التواصل الاجتماعي"
    >
      <img
        src="social-page-v3.png"
        alt="حضوركم ينوّر حنّتنا، تواصلوا معنا"
      >

      <nav
        class="social-hotspots"
        aria-label="روابط التواصل الاجتماعي"
      >
        <a
          class="instagram"
          href="https://www.instagram.com/ghada.invitations?igsi=dndkd3lhMmJ0M2E5&amp;utm_source=qr"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="إنستغرام"
        ></a>

        <a
          class="tiktok"
          href="https://www.tiktok.com/@ghada.invitations?_r=1&amp;_t=ZS-99Ru8uGvd10"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="تيك توك"
        ></a>

        <a
          class="snapchat"
          href="https://snapchat.com/t/n8AEKXRm"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="سناب شات"
        ></a>
      </nav>
    </section>

  </main>

  <!-- الموسيقى -->
  <audio
    id="backgroundMusic"
    loop
    preload="auto"
  >
    <source
      src="music-v3.mp3"
      type="audio/mpeg"
    >
  </audio>

  <!-- زر الموسيقى -->
  <button
    id="musicToggle"
    class="music-toggle"
    type="button"
    aria-label="كتم الموسيقى"
    aria-pressed="false"
  >
    ♫
  </button>

  <script src="script.js"></script>
</body>
</html>
